version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrackai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrackpassword}
      POSTGRES_DB: ${POSTGRES_DB:-fintrackai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintrack} -d ${POSTGRES_DB:-fintrackai}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
